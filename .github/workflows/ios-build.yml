name: Build TimestampCamera iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project TimestampCamera.xcodeproj \
            -scheme TimestampCamera \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Create IPA
        run: |
          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/TimestampCamera.app \
            Payload/

          zip -r TimestampCamera.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TimestampCamera-IPA
          path: TimestampCamera.ipa
          retention-days: 7