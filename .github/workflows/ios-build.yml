name: Build TimestampCamera iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Clean
        run: |
          rm -rf build Payload TimestampCamera.ipa

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project TimestampCamera.xcodeproj \
            -scheme TimestampCamera \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Prepare clean IPA
        run: |
          mkdir -p Payload

          APP="build/Build/Products/Release-iphoneos/TimestampCamera.app"

          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/TimestampCamera"

          rm -rf "$APP/_CodeSignature"
          rm -f "$APP/embedded.mobileprovision"

          cp -R "$APP" "Payload/TimestampCamera.app"

      - name: Validate app
        run: |
          APP="Payload/TimestampCamera.app"

          echo "=== APP INFO ==="
          ls -la "$APP"

          echo "=== INFO.PLIST ==="
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"

          echo "=== EXECUTABLE FILE ==="
          test -f "$APP/TimestampCamera"
          file "$APP/TimestampCamera"

          echo "=== CODE SIGNATURE CHECK ==="
          if [ -d "$APP/_CodeSignature" ]; then
            echo "ERROR: _CodeSignature still exists"
            exit 1
          else
            echo "OK: no _CodeSignature"
          fi

          echo "=== PROVISIONING PROFILE CHECK ==="
          if [ -f "$APP/embedded.mobileprovision" ]; then
            echo "ERROR: embedded.mobileprovision still exists"
            exit 1
          else
            echo "OK: no embedded.mobileprovision"
          fi

          echo "=== APP VALIDATION PASSED ==="

      - name: Create IPA
        run: |
          /usr/bin/zip -qry TimestampCamera.ipa Payload

      - name: Verify IPA
        run: |
          echo "=== IPA CONTENTS ==="
          unzip -l TimestampCamera.ipa

          echo "=== IPA FILE ==="
          ls -lh TimestampCamera.ipa

          test -f TimestampCamera.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TimestampCamera-IPA-Fixed
          path: TimestampCamera.ipa
          retention-days: 7
