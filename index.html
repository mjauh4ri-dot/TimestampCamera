<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Timestamp Camera</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="cameraApp">
<video id="camera" autoplay playsinline webkit-playsinline muted></video>
<canvas id="photoCanvas"></canvas>

<div class="camera-grid" aria-hidden="true">
<div class="vertical v1"></div><div class="vertical v2"></div>
<div class="horizontal h1"></div><div class="horizontal h2"></div>
</div>

<div class="topBar">
<button id="flashButton" class="cameraButton" type="button">⚡</button>
<div class="cameraTitle">Timestamp Camera</div>
<button id="cameraSwitch" class="cameraButton" type="button">🔄</button>
</div>

<div class="zoomControl">
<button id="zoomMinus" class="zoomButton" type="button">−</button>
<span id="zoomValue">1×</span>
<button id="zoomPlus" class="zoomButton" type="button">+</button>
</div>

<div id="timestamp" class="timestamp bottom-right">
<span id="timestampText"></span>
<span id="locationText" class="location"></span>
<span id="watermarkText" class="watermark"></span>
</div>

<div id="focusBox" class="focusBox"></div>

<div class="cameraModes">
<span>PANO</span><span>VIDEO</span><span class="active">FOTO</span><span>PORTRAIT</span>
</div>

<div class="bottomBar">
<button id="galleryButton" class="bottomButton" type="button">▣</button>
<button id="captureButton" class="captureButton" type="button"><span></span></button>
<button id="settingsButton" class="bottomButton" type="button">⚙</button>
</div>

<div id="startScreen" class="startScreen">
<div class="startBox">
<h1>Timestamp Camera</h1>
<p>Kamera dengan tanggal dan waktu.</p>
<button id="startCamera" type="button">BUKA KAMERA</button>
</div>
</div>

<div id="settingsPanel" class="settingsPanel hidden">
<div class="settingsHeader"><h2>Pengaturan</h2><button id="closeSettings" type="button">×</button></div>
<label><input id="showLocation" type="checkbox"> Tampilkan GPS</label>
<label><input id="showSeconds" type="checkbox" checked> Tampilkan detik</label>
<label>Ukuran timestamp <input id="fontSize" type="range" min="18" max="60" value="30"></label>
<label>Posisi timestamp
<select id="timestampPosition">
<option value="bottom-right" selected>Kanan bawah</option>
<option value="bottom-left">Kiri bawah</option>
<option value="top-right">Kanan atas</option>
<option value="top-left">Kiri atas</option>
</select>
</label>
<label>Watermark <input id="watermarkInput" type="text" maxlength="40" placeholder="Contoh: MJ SERVICE"></label>
<button id="closeSettingsButton" class="closeSettingsButton" type="button">SELESAI</button>
</div>

<div id="toast" class="toast" role="status"></div>
</div>
<script src="app.js"></script>
</body>
</html>
