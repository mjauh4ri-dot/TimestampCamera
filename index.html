<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Timestamp Camera</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><main class="app"><video id="video" autoplay playsinline muted></video><canvas id="canvas" hidden></canvas><header><button id="switch">↻</button><b>Timestamp Camera</b><button id="settings">⚙︎</button></header><div id="stamp"><div id="date"></div><div id="time"></div><div id="loc">📍 Mencari lokasi…</div></div><footer><button id="flash">⚡</button><button id="capture" class="shutter"><i></i></button><button id="help">▣</button></footer><section id="start"><h2>Timestamp Camera</h2><p>Gunakan kamera dan lokasi untuk membuat foto dengan timestamp.</p><button id="open">Buka Kamera</button><small>Kamera Safari membutuhkan HTTPS.</small></section><section id="panel" hidden><h2>Pengaturan</h2><label><input id="showLoc" type="checkbox" checked> Tampilkan lokasi</label><label><input id="showSec" type="checkbox" checked> Tampilkan detik</label><label>Ukuran <input id="size" type="range" min="18" max="52" value="28"></label><label>Posisi <select id="pos"><option value="bl">Kiri bawah</option><option value="br">Kanan bawah</option><option value="tl">Kiri atas</option><option value="tr">Kanan atas</option></select></label><label>Watermark <input id="wm" maxlength="40" placeholder="MJ SERVICE"></label><button id="close">Tutup</button></section><div id="toast"></div></main><script src="app.js"></script></body></html>
